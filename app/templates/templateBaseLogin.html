<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Análisis</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="./../static/favicon.ico" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet"
        type="text/css" />
    <!-- Google fonts-->
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,300italic,400italic,700italic" rel="stylesheet"
        type="text/css" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="../static/css/styles.css" rel="stylesheet" />
</head>




<style>
    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    .navbar {
        background-color: white;
    }

    .main-container {
        flex-grow: 1;
        margin-top: 70px;
        /* Ajusta según la altura de tu barra de navegación */
    }

    @media (max-width: 768px) {
        .main-container {
            margin-top: 150px;
            /* Ajusta según la altura de tu barra de navegación en pantallas más pequeñas */
        }

        .navbar .navbar-nav {
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
        }
    }
</style>

<body class="bodyfondo">
    <!-- Navigation -->
    <nav class="navbar fixed-top navbar-expand-lg blur-overlay">
        <div class="row">
            <div class="col-2">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="row col-10 ">


            </div>
        </div>
        <div class="collapse navbar-collapse ms-auto justify-content-end" id="navbarNav">
            <div class="d-flex justify-content-center mt-3 mt-lg-0">
                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a href="{{ url_for('login')}}" class="btn">
                            <i class="bi bi-person"></i> Iniciar sesión
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('registrarUsuario')}}" class="btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-add" viewBox="0 0 16 16">
                                <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m.5-5v1h1a.5.5 0 0 1 0 1h-1v1a.5.5 0 0 1-1 0v-1h-1a.5.5 0 0 1 0-1h1v-1a.5.5 0 0 1 1 0m-2-6a3 3 0 1 1-6 0 3 3 0 0 1 6 0M8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4"/>
                                <path d="M8.256 14a4.5 4.5 0 0 1-.229-1.004H3c.001-.246.154-.986.832-1.664C4.484 10.68 5.711 10 8 10q.39 0 .74.025c.226-.341.496-.65.804-.918Q8.844 9.002 8 9c-5 0-6 3-6 4s1 1 1 1z"/>
                              </svg> Crear cuenta
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    

    
    <!-- Contenedor principal con clase main-container -->
    <div class="container pt-1 main-container">
        {% block form %}
        <!-- ... Contenido principal ... -->
        {% endblock %}
    </div>
    <!-- Footer -->
    <footer class="footer footerfondo mt-5">
        <div class="container">
            <div class="row">


            </div>
        </div>
    </footer>

    <!-- Bootstrap core JS y otros scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/scripts.js"></script>
    <script src="https://cdn.startbootstrap.com/sb-forms-latest.js"></script>
</body>

</html>
