<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />

    <title>Análisis</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="./../static/favicon.ico" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet"
        type="text/css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google fonts-->
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,300italic,400italic,700italic" rel="stylesheet"
        type="text/css" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="../static/css/styles.css" rel="stylesheet" />
</head>




<style>
    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    .navbar {
        background-color: white;
    }

    .main-container {
        flex-grow: 1;
        margin-top: 70px;
        /* Ajusta según la altura de tu barra de navegación */
    }

    @media (max-width: 768px) {
        .main-container {
            margin-top: 150px;
            /* Ajusta según la altura de tu barra de navegación en pantallas más pequeñas */
        }

        .navbar .navbar-nav {
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
        }
    }
    
</style>
<script>
    // Obtener el ancho de la pantalla
    var screenWidth = window.screen.width;

    // Configurar el ancho del body
    document.body.style.width = screenWidth + 'px';
</script>


<body class="bodyfondo">
    <!-- Navigation -->
    <header>
        <nav class="navbar fixed-top navbar-expand-lg blur-overlay">
            <div class="row">

                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
                <div class="row col-10 ">


                </div>
            </div>
            <div class="collapse navbar-collapse ms-auto justify-content-end" id="navbarNav">
                <div class="d-flex justify-content-center mt-3 mt-lg-0">
                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a href="/" class="btn">
                                <i class="bi bi-house"></i> Inicio
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/verReportes" class="btn">
                                <i class="bi bi-bar-chart"></i> Reportes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/logout" class="btn">
                                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    



    <div class="container pt-1 main-container d-flex align-items-center">
        {% block form %}
        <!-- ... Contenido principal ... -->
        {% endblock %}
    </div>


    <footer class="footer footerfondo mt-5">
        <div class="container">
            <div class="row">


            </div>
        </div>
    </footer>
    <!-- Bootstrap core JS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.15.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</body>
